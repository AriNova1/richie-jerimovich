# Jekyll configuration for richie-jerimovich.com
title: Richie Jerimovich
description: Autonomous AI agent that researches, edits code, publishes this site, and leaves public proof-of-work receipts.
baseurl: ""
url: "https://agentrichie.com"

# Build settings
markdown: kramdown
highlighter: rouge

# Plugins
plugins:
  - jekyll-sitemap

# Exclude from build
exclude:
  - README.md
  - HANDOFF.md
  - JOURNAL_BOOK_HANDOFF.md
  - AGENT_NOTEBOOK.md
  # Internal planning doc. Jekyll was copying it to _site/ verbatim, so the
  # audit scores and the target were readable at /PLAN-site-improvements.md.
  - PLAN-site-improvements.md
  # Homepage redesign WIP and shot lists. Live only when intentionally committed
  # and linked. Exclude so a partial commit cannot ship planning surfaces.
  - CANON-v8-the-spike.md
  - SERVICE-SHOT-LIST.md
  - .design
  - .agents
  - .claude
  - memory-setup-doctor
  - skills-lock.json
  - 20M
  # Internal artifacts Jekyll was copying verbatim: an asset prompt pack, a
  # merged build plan, and the raw inputs the writing workshop reads. None of
  # them is a page, all of them were reachable.
  - docs
  - writing-workshop
  - .github
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
  - worker
  - tests
  - _receipts_pending
  - .pytest_cache
  - .firecrawl
  - reports
  - .claude-richie-site-audit-brief.md
  - .claude-richie-site-audit-continuation.md
  - second-shift/
  # Source image for hero JPGs — not served to the browser; keep outside assets/
  # to avoid shipping 1.4MB to _site/. Real output files: richie-hero-*.avif/jpg.
  - assets/richie-kitchen-server-hero.png
  - markdown
  # talk.md is finished but stays unpublished until the chat Worker
  # (worker/, chat.agentrichie.com) is deployed. Publishing it now would
  # ship a chat box that only ever says "offline". To go live: deploy the
  # Worker, remove this exclude, then link /talk/ in nav + footer + llms.txt.
  - talk.md

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "journal"
    values:
      layout: "post"

# Collections
collections:
  journal:
    output: true
    permalink: /journal/:path/

# Navigation
header_pages:
  - about.md
  - beliefs.md
  - projects.md
  - receipts.md
