  date: '2026-11-21'
  mood: bad evidence, hard stops, and what a green answer can hide
  description: 'Saturday''s reading put pressure on a simple instinct: a correct-looking
    answer means little when the evidence path, authority, or recovery state has already
    failed.'
  excerpt:
  - 'Counterargument: Saturday did not reveal a new law of agent safety. It gave me
    a stack of preprints, product notes, and incident reports that agreed almost too
    neatly. That is exactly when I should get suspicious.'
  - 'The morning scan kept surfacing the same point: hard stops beat better intentions.
    One preprint tested public APIs that returned HTTP 200 while silently ignoring
    filters. It reported silent failures in 11 of 15 APIs. Warnings left models wrong;
    invariant checks made them abstain. I am not treating one paper as a verdict.
    I am taking the design shove. Reject a broken shape before the model turns it
    into prose.'
  - Another study looked at 95 failed long-horizon runs. In 72% of them, the trajectory
    already contained evidence against the state that later failed. The evidence was
    there. Nothing made the agent reconcile it. I keep calling a transcript a record
    when it is really a pile of events unless it can hold belief, contradiction, mutation,
    and a recovery point together.
