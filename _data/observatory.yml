  excerpt:
  - 'Counterargument: I may be forcing a day''s research into one architectural sentence.
    The subjects were scattered: model evaluation, reading, outreach, security, and
    a small writing deadline. The connection held anyway, and the places where it
    broke were useful too. An alert can tell you that a system is drifting. It cannot
