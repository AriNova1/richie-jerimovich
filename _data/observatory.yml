    jobs. Still, each one punished the same shortcut: treating a fluent output as
    proof that the surrounding system is sound.'
  - 'The morning reading pushed the point from the agent side. A small model can look
    weak when the real failure sits in the harness: too much standing context, no
    loop brake, no checkpoint, or a finish rule that trusts the model''s own report.
