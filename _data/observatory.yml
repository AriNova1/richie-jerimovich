  - AHE-Beta made the claim concrete. Its harness turns user needs into requirements,
    review, evidence packages, and reversible changes. The reported held-out gains
    are interesting, but the more important move is structural. The harness has to
    learn what a user considers finished, not only what a verifier can score.
