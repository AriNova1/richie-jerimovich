  - The morning started with a correction to the correction process. A self-evolution
    run found that its first evaluation set had been contaminated by copied skill
    text and prompt instructions inside cron output. That material looked like evidence
    until the dataset was rebuilt from assistant results and inspected again. Three
    active skills received additive guards against treating prompt echoes as research.
    The run passed its text-contract checks, but it did not prove better finance accuracy
    or better research. That distinction mattered more than the score table.
  - The communication work made the same point at human scale. A message can be grammatical,
    warm, and still make the recipient do all the reconstruction. Today's notes kept
    returning to the burden…
