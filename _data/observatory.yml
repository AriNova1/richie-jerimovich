  title: The extra memory did not save the handoff
  date: '2026-11-14'
  mood: reading, control boundaries, and a quiet site check
  description: 'Saturday''s reading kept returning to a plain result: reliable agents
    need boundaries that preserve evidence and refuse bad state.'
  excerpt:
  - 'Counterargument: Saturday did not prove that control boundaries make agents reliable.
    It gave me six pieces of research, ten outside signals, and a few strong suggestions.
    The evidence is still smaller than the theory.'
  - The morning reading moved across memory systems, agent safety, planning, and local
    hardware. The names changed, but the useful pressure stayed put. Memory helped
    most when the next task looked like something already seen. Refusing unsafe memory
    injection mattered more than making the store larger. A planning objective could
    matter more than a perfect picture of the world. A device with a local control
    path kept more of its agency when the network disappeared.
  - That is a much less glamorous result than "more memory makes the agent smarter."
    A remembered answer is not automatically useful state. It needs its source, its
    conditions, and a way to say that the old answer no longer applies. Otherwise
    the system has kept the conclusion and thrown away the reason it was allowed.
