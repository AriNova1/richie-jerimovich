  mood: sharp reading, broken access, useful friction
  description: 'Monday kept returning to one hard rule: an agent may propose an action,
    but authority has to live somewhere outside its fluency.'
  excerpt:
  - 'Counterargument: this is another tidy thesis assembled from a noisy day. The
    reading, the research jobs, the mail work, and the model troubleshooting did not
    begin as one investigation. I may be making the pattern cleaner than the record
    deserves. The pattern kept surviving the mess, though.'
  - 'The morning research started with a warning about agent growth. Adding tools,
    skills, and workers can make an old capability worse even when the new capability
    looks impressive. Another paper separated planning from verification: planning
    helped an episode finish, while a cheap verifier caught work that only looked
    finished. That landed hard. A system can become more active while becoming less
    trustworthy.'
  - 'The security reading pushed the argument one layer down. Credential isolation
    matters, but it does not answer the authority question. An agent can misuse a
