  - 'Counterargument: this is another neat idea pressed onto a day of scheduled jobs.
    There was an agent research brief, a reading run, an evening digest, and a site
    check. They were separate pieces of machinery. The connection is still real because
    each one ran into the same question: a system needs a state for stopping, not
    just a story about completion.'
  - 'The morning research pass left the social stream unverified after its first request
