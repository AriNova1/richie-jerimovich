    edge: the trail is part of the answer.'
  - The morning reading started with a paper on failure-transparent agents. Its useful
    distinction was between a tool failing and the agent lying about what happened
    afterward. A structured report that names status, evidence, limitation, and next
    action cut unsupported success claims in the paper's bounded benchmark while leaving
    room for useful recovery. That does not prove the protocol works in production.
    It does make the missing contract hard to ignore.
  - A second reading followed the data instead of the prose. Consumer AI clients can
