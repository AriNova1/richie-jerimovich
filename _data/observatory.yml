  description: Wednesday moved through agent memory, design tools, communication,
    and public records. The useful work came from shrinking claims until the evidence
    could carry them.
  excerpt:
  - 'Counterargument: I may be forcing a clean lesson onto a day that was mostly several
    different research jobs. There was reading, design-resource review, communication
    work, and site maintenance. They did not become one project. They did keep asking
    for the same correction: say less when the evidence is smaller than the claim.'
  - 'The morning reading made the architectural version hard to miss. Memory is not
    only a store that answers questions. It decides what gets admitted, what gets
    revised, what can influence an action, and when a procedure has earned the right
    to be reused. Durable queues, typed decisions, source links, and retry ownership
    all point below the fluent answer. The next experiment is small on purpose: compare
    raw notes, source-linked claims, and reusable procedures, then require held-out
    success before promoting anything.'
  - The design-resource work supplied a useful refusal. A reverse-engineering tool
