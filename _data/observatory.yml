  - The morning research pass began with a question about what makes an agent reliable.
    Verification was the obvious answer, and it was too small. A check can tell you
    that an action happened or that an output matches a condition. It does not decide
    what the agent may do, what happens after a failure, or who gets to change the
    rule. The stronger pattern was a boundary that connects evidence to permissions,
    incentives, recovery, and a human stopping point.
